server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: dept-mgmt-backend
  # 数据源配置（凭据通过环境变量注入，默认值仅用于本地开发；本项目专用实例 3307，与系统其他 MySQL 隔离）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/dept_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # Servlet文件上传配置（M7 整改：500MB→100MB，防止超大包占满磁盘/内存；配合用户配额与魔数校验）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # 异步线程池
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dept.mgmt.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-methods-invoke: true

# JWT配置
jwt:
  # 密钥（Base64，解码后不少于32字节）：生产环境必须通过环境变量 JWT_SECRET 注入强随机密钥，
  # 未配置/使用已泄露旧默认密钥时生产启动失败（fail-fast）；本地开发自动切换内置轮换开发密钥
  secret: "${JWT_SECRET:}"
  # Token有效期（秒），2小时
  expiration: 7200
  # Token请求头名称
  header: Authorization
  # Token前缀
  token-prefix: "Bearer "

# 文件存储配置
file:
  # 存储方式：local / minio
  storage-type: local
  local:
    # 上传根路径
    upload-path: D:/dept-mgmt/files
    # 访问URL前缀
    url-prefix: /files

# 微信小程序配置
wechat:
  miniapp:
    appid: ""
    secret: ""
    # 微信登录开发模式开关（code 即 openid）：仅限本地开发调试，默认关闭；
    # 部署到任何外部环境必须保持 false 并配置真实 appid/secret，否则微信登录返回 503
    dev-mode: false

# 钉钉配置（T-309 免登+审批回调；企业凭证运行时经 /v1/dingtalk/auth/config 配置，AES-GCM 加密落库）
dingtalk:
  # 免登开发模式开关（未配置企业凭证时 authCode 即 dingtalkUserId）：仅限本地开发联调，默认关闭；
  # 部署到任何外部环境必须保持 false 并配置真实企业应用凭证，否则钉钉免登返回 503
  dev-mode: false

# 跨域白名单（逗号分隔）
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  # 阶段一多 Agent 协同：MCP Server（Dify/Hermes 接入点）鉴权密钥，生产通过环境变量注入
  mcp:
    api-key: ${MCP_API_KEY:dept-mcp-2026r2-dev-key}
    # MCP 系统委托身份（A3 只读工具执行用；A4 升级为 X-Acting-User-Id 逐调用透传）
    acting-user-id: ${MCP_ACTING_USER_ID:1}
  # Hermes 主 Agent API Server（B1：/v1/runs 投递；enabled=false 时第四级路由永久降级）
  hermes:
    base-url: ${HERMES_BASE_URL:http://127.0.0.1:8642}
    api-key: ${HERMES_API_KEY:dept-hermes-api-2026r2-K7mR4pXwL9cT2vBn}
    enabled: ${HERMES_ENABLED:true}
    poll-interval-ms: 2000
    await-timeout-ms: 600000
  # 决策建议审批参数 HMAC 密钥（HITL 护栏：审批执行前重算比对防篡改）
  advice:
    hmac-secret: ${ADVICE_HMAC_SECRET:dept-advice-hmac-2026r2-dev}

# AI 服务配置（T-105：统一经 ai-gateway 8090 调模型，任何业务代码不得直连模型 API）
ai:
  gateway:
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
    # 服务间认证密钥，须与网关 GATEWAY_API_KEY 一致（生产通过环境变量注入；旧默认值已轮换作废）
    api-key: ${GATEWAY_API_KEY:dept-gw-internal-2026r2-fA9kQ2xV}

# 日志配置
logging:
  level:
    com.dept.mgmt: debug
    com.baomidou: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc配置（M6 整改：生产环境通过环境变量 SPRINGDOC_ENABLED=false 关闭，
# 防止未认证枚举全部接口与参数模型）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
