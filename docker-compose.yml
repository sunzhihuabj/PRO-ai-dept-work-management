version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dept-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: dept_mgmt
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    ports:
      # 仅绑定本机回环地址，禁止数据库端口对外网暴露
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: dept-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dept_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-3V/8Fp0IsOdSAOqOpm6xFXZWDEu4xw8kasX737jXMH9p/JLZskFtAidjwOJfJIBj}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FILE_LOCAL_UPLOAD_PATH: /data/files
    volumes:
      - file-data:/data/files
    ports:
      - "8081:8081"

  # AI 网关：全系统模型调用唯一出口（T-105），backend 经内部 API-Key 调用
  ai-gateway:
    build: ./ai-gateway
    container_name: dept-ai-gateway
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dept_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-dept-gateway-internal-key-2026}
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-dept-ai-config-secret-key-2026-change-me-please}
    ports:
      - "127.0.0.1:8090:8090"

  frontend:
    build: ./frontend
    container_name: dept-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_PROXY: http://backend:8081

  # ===== AI 基础设施（Phase 1 起使用，默认不启动，需 docker compose --profile ai up 启用）=====
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dept-rabbitmq
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dept_mgmt}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dept_mgmt_pass}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: dept-pgvector
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      POSTGRES_DB: dept_ai
      POSTGRES_USER: ${PGVECTOR_USER:-dept_ai}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-dept_ai_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: dept-minio
    restart: unless-stopped
    profiles: ["ai"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-dept_mgmt}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-dept_mgmt_pass}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  file-data:
  rabbitmq-data:
  pgvector-data:
  minio-data:
