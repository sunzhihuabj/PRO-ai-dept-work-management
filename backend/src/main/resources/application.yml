server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: dept-mgmt-backend
  # 数据源配置（凭据通过环境变量注入，默认值仅用于本地开发；本项目专用实例 3307，与系统其他 MySQL 隔离）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/dept_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # Servlet文件上传配置
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  # 异步线程池
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dept.mgmt.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-methods-invoke: true

# JWT配置
jwt:
  # 密钥（Base64，解码后不少于32字节，不足则启动失败；生产环境必须通过环境变量 JWT_SECRET 注入强随机密钥）
  secret: "${JWT_SECRET:3V/8Fp0IsOdSAOqOpm6xFXZWDEu4xw8kasX737jXMH9p/JLZskFtAidjwOJfJIBj}"
  # Token有效期（秒），2小时
  expiration: 7200
  # Token请求头名称
  header: Authorization
  # Token前缀
  token-prefix: "Bearer "

# 文件存储配置
file:
  # 存储方式：local / minio
  storage-type: local
  local:
    # 上传根路径
    upload-path: D:/dept-mgmt/files
    # 访问URL前缀
    url-prefix: /files

# 微信小程序配置
wechat:
  miniapp:
    appid: ""
    secret: ""
    # 微信登录开发模式开关（code 即 openid）：仅限本地开发调试，默认关闭；
    # 部署到任何外部环境必须保持 false 并配置真实 appid/secret，否则微信登录返回 503
    dev-mode: false

# 跨域白名单（逗号分隔）
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

# AI服务配置（Ollama）
ai:
  ollama:
    base-url: http://localhost:11434
    model: qwen2.5:7b
    timeout: 60

# 日志配置
logging:
  level:
    com.dept.mgmt: debug
    com.baomidou: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
