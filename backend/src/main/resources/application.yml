server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: dept-mgmt-backend
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dept_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # Servlet文件上传配置
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  # 异步线程池
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dept.mgmt.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-methods-invoke: true

# JWT配置
jwt:
  # 密钥（生产环境应通过环境变量注入）
  secret: ZGVwdC1tZ210LWp3dC1zZWNyZXQta2V5LWFpLWRlcHQtbWFuYWdlLWZpcmUtMjAyNg==
  # Token有效期（秒），2小时
  expiration: 7200
  # Token请求头名称
  header: Authorization
  # Token前缀
  token-prefix: "Bearer "

# 文件存储配置
file:
  # 存储方式：local / minio
  storage-type: local
  local:
    # 上传根路径
    upload-path: D:/dept-mgmt/files
    # 访问URL前缀
    url-prefix: /files

# 微信小程序配置（appid/secret 为空时走开发模式：code 即 openid）
wechat:
  miniapp:
    appid: ""
    secret: ""

# AI服务配置（Ollama）
ai:
  ollama:
    base-url: http://localhost:11434
    model: qwen2.5:7b
    timeout: 60

# 日志配置
logging:
  level:
    com.dept.mgmt: debug
    com.baomidou: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
